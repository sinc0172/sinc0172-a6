<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7: emdesigns Professional Site</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- header section; would feature site title, logo, and main navigation -->
    <header class="site-header">
        <h1 class="site-title">emdesigns</h1>
        <nav class="main-nav"> 
            <a href="#">Projects</a>
            <a href="#">About</a>
            <a href="#">Ramblings</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <!-- contact form -->
         <section id="contact">
            <h2>Contact</h2>
            <!-- the method selected for the contact form is POST, as the data collected from the form is not intended to be visible in the URL and may contain sensitive information. It will be sent to the server to be processed. -->
            <form action="" method="post">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="">Select a subject</option>
                    <option value="project-inquiry">Project Inquiry</option>
                    <option value="general-question">General Question</option>
                    <option value="feedback">Feedback</option>
                </select>

                <label for="message">Message</label>
                <textarea id="message" rows="4" name="message" required></textarea>

                <fieldset>
                    <legend>Preferred Contact Method</legend>
                    <input type="radio" id="by-email" name="contact" value="email">
                    <label for="by-email">Email</label>
                    <input type="radio" id="by-phone" name="contact" value="phone">
                    <label for="by-phone">Phone</label>
                </fieldset>

                <button type="submit">Send</button>
            </form>
        </section>



    </main>
